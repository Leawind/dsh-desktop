name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop -> target"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run release:prepare -- "${{ github.ref_name }}" release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
            signing_identity: ""
          - runner: windows-2022
            artifact: windows-x86_64
            signing_identity: ""
          - runner: macos-15-intel
            artifact: macos-x86_64
            signing_identity: "-"
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop -> target"

      - uses: actions/cache@v4
        with:
          path: |
            .cache/runtime
            .cache/build-tools
            apps/desktop/runtime/bundled
          key: bundled-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/versions.json', 'runtime/package.json', 'runtime/package-lock.json', 'scripts/prepare-runtime.ts', 'scripts/appimage-runtimes.json') }}

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: apps/desktop/target/release/bundle/installers/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: release-metadata

      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ github.ref_name }}
          body_path: release-metadata/release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
