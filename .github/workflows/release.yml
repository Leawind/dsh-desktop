name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop -> target"

      - name: Install WebUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            wget

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run release:prepare -- "${{ github.ref_name }}" release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
            signing_identity: ""
          - runner: windows-2022
            artifact: windows-x86_64
            signing_identity: ""
          - runner: macos-15-intel
            artifact: macos-x86_64
            signing_identity: "-"
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
      DSH_DESKTOP_PACKAGE_INSTALLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop -> target"

      - uses: actions/cache@v4
        with:
          path: |
            .cache/runtime
            .cache/build-tools
            apps/desktop/runtime/bundled
          key: bundled-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/versions.json', 'runtime/package.json', 'runtime/package-lock.json', 'scripts/prepare-runtime.ts') }}

      - name: Install WebUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            wget

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Archive release assets
        if: runner.os == 'Linux'
        shell: bash
        working-directory: apps/desktop/target/release/artifacts
        run: |
          shopt -s nullglob
          assets=(dsh-desktop-*-portable)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            tar -czf "${asset}.tar.gz" "$asset"
            rm "$asset"
          done

      - name: Archive release assets
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop/target/release/artifacts
        run: |
          shopt -s nullglob
          assets=(dsh-desktop-*-portable)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            zip -q "${asset}.zip" "$asset"
            rm "$asset"
          done

      - name: Archive release assets
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/target/release/artifacts
        run: |
          $assets = Get-ChildItem -File -Filter 'dsh-desktop-*-portable.exe'
          if ($assets.Count -eq 0) {
            throw 'No release assets were built.'
          }
          foreach ($asset in $assets) {
            Compress-Archive -LiteralPath $asset.FullName -DestinationPath "$($asset.FullName).zip" -Force
            Remove-Item -LiteralPath $asset.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.artifact }}
          path: apps/desktop/target/release/artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: release-metadata

      - uses: actions/download-artifact@v5
        with:
          pattern: executables-*
          path: release-assets
          merge-multiple: true

      - run: pnpm install --frozen-lockfile
      - uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ github.ref_name }}
          body_path: release-metadata/release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
