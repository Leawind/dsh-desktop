[package]
name = "dsh-desktop"
version = "0.2.0"
description = "A desktop application for DeepSeek Harness"
authors = ["Leawind"]
license = "MIT"
repository = "https://github.com/Leawind/dsh-desktop"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tao = "0.34"
tiny_http = "0.12"
tray-icon = "0.24"
url = "2"
png = "0.17"
