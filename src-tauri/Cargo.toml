[package]
name = "dsh-desktop"
version = "0.1.0"
description = "A desktop application for DeepSeek Harness"
authors = ["Leawind"]
license = "MIT"
repository = "https://github.com/Leawind/dsh-desktop"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
